<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#16141d"><title>Detalhes do pedido | MedelFiguri</title>
        <link rel="stylesheet" href="/src/styles/styles.css"><script type="module" src="/src/app/pedido.js"></script>
    </head>
    <body>
        <header class="site-header">
            <a class="brand" href="/">Medel<span>Figuri</span></a>
            <nav class="site-nav" aria-label="Navegação principal">
                <a href="/meus-pedidos.html">Meus pedidos</a>
                <a class="button button-small button-quiet cart-link" href="/carrinho.html">Carrinho <span data-cart-count>(…)</span></a>
                <div class="account-controls" data-account-controls hidden><span class="user-label" data-auth-user></span><button class="button button-small button-quiet" type="button" data-logout>Sair</button></div>
            </nav>
        </header>
        <main class="commerce-page">
            <p class="commerce-message" data-message role="status" aria-live="polite">Carregando pedido...</p>
            <article data-order hidden>
                <p class="eyebrow">Compra MedelFiguri</p><h1 data-order-number></h1>
                <p class="order-status" data-status></p>
                <p class="payment-note">Pagamento simulado — nenhuma cobrança real será realizada. Não informe dados de cartão.</p>
                <div data-items class="order-lines"></div>
                <section class="commerce-card" data-address></section>
                <dl class="order-totals"><div><dt>Subtotal</dt><dd data-subtotal></dd></div><div><dt>Frete</dt><dd data-shipping></dd></div><div><dt>Descontos</dt><dd data-discount></dd></div><div class="summary-total"><dt>Total</dt><dd data-total></dd></div></dl>
                <div class="commerce-actions"><button class="button" type="button" data-confirm hidden>Confirmar pagamento simulado</button><button class="button button-quiet" type="button" data-cancel hidden>Cancelar pedido</button></div>
                <p class="commerce-message" data-action-message role="status" aria-live="polite"></p>
            </article>
        </main>
        <footer class="site-footer"><a class="brand" href="/">Medel<span>Figuri</span></a><p>Feito para quem coleciona histórias.</p></footer>
    </body>
</html>

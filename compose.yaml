services:
  db:
    container_name: db
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: medelfiguri
      MYSQL_DATABASE: medelfiguri
      MYSQL_USER: medelfiguri
      MYSQL_PASSWORD: medelfiguri
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 5s
      retries: 10

  api:
    container_name: api
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      VIEW_COMPILED_PATH: /tmp/medelfiguri-views
    volumes:
      - ./api/.env:/app/.env
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1:8000/api/docs/openapi.yaml') === false ? 1 : 0);",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

  proxy:
    container_name: proxy
    build:
      context: ./proxy
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"

volumes:
  mysql_data:
